name: Paper2Career daily ingestion

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Edition date (YYYY-MM-DD). Empty = last LOOKBACK_DAYS days"
        required: false
      pages:
        description: "Comma-separated page numbers to process (skips classifieds detection)"
        required: false
  schedule:
    # Runs at 06:00, 07:00, 10:00, and 14:00 IST every day as soon as the e-paper is published.
    # Re-runs are idempotent: processed editions are skipped and no duplicate rows are created.
    - cron: "30 0 * * *"   # 06:00 IST
    - cron: "30 1 * * *"   # 07:00 IST
    - cron: "30 4 * * *"   # 10:00 IST
    - cron: "30 8 * * *"   # 14:00 IST

permissions:
  contents: read

concurrency:
  group: ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Restore downloaded pages and OCR cache
        uses: actions/cache@v4
        with:
          path: worker/downloads
          key: pages-${{ github.run_id }}
          restore-keys: pages-

      - name: Run tests
        run: python -m pytest -q

      - name: Run ingestion
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID || '6adbb053000fa129e183' }}
          AUTO_PUBLISH: "true"
          OCR_ENGINE: tesseract
          INPUT_DATE: ${{ inputs.date }}
          INPUT_PAGES: ${{ inputs.pages }}
          TRIGGER: ${{ github.event_name }}
        run: |
          ARGS=(--auto-publish)
          if [ -n "$INPUT_DATE" ]; then ARGS+=(--date "$INPUT_DATE"); fi
          for p in ${INPUT_PAGES//,/ }; do ARGS+=(--page "$p"); done
          python -m paper2career run --trigger "$TRIGGER" "${ARGS[@]}"

      - name: Prune page cache older than 7 days
        if: always()
        run: find downloads -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} + || true
