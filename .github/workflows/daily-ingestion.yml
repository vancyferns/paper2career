name: Paper2Career daily ingestion

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Edition date (YYYY-MM-DD). Empty = last LOOKBACK_DAYS days"
        required: false
      pages:
        description: "Comma-separated page numbers to process (skips classifieds detection)"
        required: false
  schedule:
    # Staggered early morning runs (IST = UTC + 5:30)
    # 7:05 AM IST (01:35 UTC) - Primary run when e-paper is published
    - cron: "35 1 * * *"
    # 7:40 AM IST (02:10 UTC) - Backup retry in case GitHub shared queue delays first run
    - cron: "10 2 * * *"
    # 8:20 AM IST (02:50 UTC) - Morning catchup
    - cron: "50 2 * * *"
    # 9:45 AM IST (04:15 UTC) - Late morning backup to catch any late newspaper editions
    - cron: "15 4 * * *"

permissions:
  contents: read

concurrency:
  group: ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Set up Cloudflare WARP
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: dual
          mode: wireguard

      - name: Verify WARP egress connection
        run: curl -s https://www.cloudflare.com/cdn-cgi/trace

      - name: Restore downloaded pages and OCR cache
        uses: actions/cache@v4
        with:
          path: worker/downloads
          key: pages-${{ github.run_id }}
          restore-keys: pages-

      - name: Run tests
        run: python -m pytest -q

      - name: Run ingestion
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_DATABASE_ID: "6adbb053000fa129e183"
          AUTO_PUBLISH: "true"
          OCR_ENGINE: tesseract
          INPUT_DATE: ${{ inputs.date }}
          INPUT_PAGES: ${{ inputs.pages }}
          TRIGGER: ${{ github.event_name }}
        run: |
          ARGS=(--auto-publish)
          if [ -n "$INPUT_DATE" ]; then ARGS+=(--date "$INPUT_DATE"); fi
          if [ -n "$INPUT_PAGES" ]; then
            for p in ${INPUT_PAGES//,/ }; do ARGS+=(--page "$p"); done
          fi
          python -m paper2career run --trigger "$TRIGGER" "${ARGS[@]}"

      - name: Auto-verify & resync daily job details against clippings
        run: |
          TARGET="${INPUT_DATE:-$(date +%Y-%m-%d)}"
          PYTHONPATH=. python scripts/resync_day.py "$TARGET" || true

      - name: Prune page cache older than 7 days
        if: always()
        run: find downloads -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} + || true
